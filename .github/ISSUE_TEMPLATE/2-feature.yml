name: 功能建议
description: 提出一项新能力或对现有行为的改进
title: "[功能] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先想清楚**要解决的问题**，而不只是想要的实现方式。
        实现方案往往有多种，问题本身才是判断依据。

        注意本插件的两条硬约束，跨过它们的提案无法采纳：
        1. 插件运行在宿主进程内，只能通过 `openai.oauth.outbound_transport.v1`
           能力接触上游 HTTP 请求，拿不到宿主的业务数据结构。
        2. 转发热路径上不得预读请求体 —— 这会让 SDK 误判请求已发出（见 CLAUDE.md 第五节）。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么场景，现有能力为什么不够用？
      placeholder: 例如：我只想评测特定模型的请求，但现在只能按账号开关。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望插件怎么做？如果涉及配置项，请给出你设想的字段名与取值。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你现在是怎么绕开这个问题的？为什么那样做不可接受？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      description: 这项改动主要落在哪一部分？
      options:
        - 配置与校验（config）
        - 转发与采集（plugin / capture）
        - 对话还原（conversation）
        - 评分逻辑与维度（scorer）
        - 队列与并发（queue）
        - 存储与裁剪（storage）
        - 配置页 UI
        - 打包 / CI / 文档
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: 是否会破坏现有配置
      description: 新增必填字段、改变默认值或调整语义都算破坏性变更。
      options:
        - 否，向后兼容
        - 是，需要迁移说明
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认该能力不依赖宿主的内部数据结构（插件无法访问）
          required: true
        - label: 即便涉及请求体，方案也不会在转发热路径上预读
          required: true
