name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '新增功能'
    labels:
      - 'feature'
      - 'enhancement'
  - title: 'Bug 修复'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '文档'
    labels:
      - 'documentation'
      - 'docs'
  - title: '维护'
    labels:
      - 'chore'
      - 'maintenance'
  - title: '性能优化'
    labels:
      - 'performance'
  - title: '安全'
    labels:
      - 'security'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'feature'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bugfix'
  default: patch
template: |
  ## Sub2API IQ Evaluator $RESOLVED_VERSION

  在转发 OpenAI OAuth 出站请求的同时异步评测对话质量。

  ## 更新内容

  $CHANGES

  ## 安装

  ### 通过 Sub2API 管理后台

  1. 下载适合你系统的 `.s2plugin` 文件
  2. 访问 `/admin/plugins` 上传并配置

  ### 从源码编译

  \`\`\`bash
  git clone https://github.com/$OWNER/$REPOSITORY.git
  cd sub2api-iq/plugin
  make pack
  \`\`\`

  ## 支持平台

  - Linux (amd64, arm64)
  - macOS (Intel, Apple Silicon)
  - Windows (amd64)

  ## 系统要求

  - Sub2API >= 0.2.8
  - Go >= 1.25

  ## 贡献者

  $CONTRIBUTORS
